<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <ellipse cx="100" cy="160" rx="45" ry="60" fill="#9D8FA8"/>
  
  <!-- Neck -->
  <rect x="85" y="110" width="30" height="30" fill="#C8B5D0"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="40" fill="#D4C5DB"/>
  
  <!-- Hair -->
  <path d="M 60 45 Q 60 20 100 20 Q 140 20 140 45 Q 140 40 100 35 Q 60 40 60 45" fill="#6B5B75"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="75" r="5" fill="#ffffff"/>
  <circle cx="115" cy="75" r="5" fill="#ffffff"/>
  
  <!-- Pupils -->
  <circle cx="85" cy="76" r="3" fill="#2D1B4E"/>
  <circle cx="115" cy="76" r="3" fill="#2D1B4E"/>
  
  <!-- Eye highlights -->
  <circle cx="86" cy="75" r="1.5" fill="#ffffff"/>
  <circle cx="116" cy="75" r="1.5" fill="#ffffff"/>
  
  <!-- Nose -->
  <path d="M 100 75 L 100 90" stroke="#B5A3C0" stroke-width="2" fill="none"/>
  
  <!-- Mouth -->
  <path d="M 85 100 Q 100 108 115 100" stroke="#E8A5D4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Blush -->
  <ellipse cx="70" cy="85" rx="8" ry="6" fill="#FFB3D9" opacity="0.4"/>
  <ellipse cx="130" cy="85" rx="8" ry="6" fill="#FFB3D9" opacity="0.4"/>
  
  <!-- Left Arm -->
  <rect x="50" y="130" width="20" height="70" rx="10" fill="#C8B5D0"/>
  
  <!-- Left Hand -->
  <circle cx="60" cy="210" r="12" fill="#D4C5DB"/>
  
  <!-- Right Arm -->
  <rect x="130" y="130" width="20" height="70" rx="10" fill="#C8B5D0"/>
  
  <!-- Right Hand -->
  <circle cx="140" cy="210" r="12" fill="#D4C5DB"/>
  
  <!-- Left Leg -->
  <rect x="75" y="215" width="18" height="70" rx="9" fill="#7A6B85"/>
  
  <!-- Left Foot -->
  <ellipse cx="84" cy="290" rx="12" ry="8" fill="#6B5B75"/>
  
  <!-- Right Leg -->
  <rect x="107" y="215" width="18" height="70" rx="9" fill="#7A6B85"/>
  
  <!-- Right Foot -->
  <ellipse cx="116" cy="290" rx="12" ry="8" fill="#6B5B75"/>
</svg>
